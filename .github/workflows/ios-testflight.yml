# Builds the iOS app on a GitHub-hosted Mac and uploads it to TestFlight.
# No Mac of your own is needed. Signing is automatic via an App Store Connect API key.
#
# Required repository secrets:
#   APPLE_TEAM_ID        10-character Team ID (App Store Connect → Membership)
#   ASC_KEY_ID           App Store Connect API key ID (Users and Access → Integrations → App Store Connect API)
#   ASC_ISSUER_ID        Issuer ID from the same page
#   ASC_KEY_P8_BASE64    base64 of the downloaded AuthKey_<KEY_ID>.p8 (role: App Manager or Admin)
#
# Before the first run: create the app record in App Store Connect with bundle ID org.otirecovery.app.
# Trigger: push a tag like v1.0.0, or run manually.
name: iOS TestFlight

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx cap sync ios

      - name: Install App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 -d > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Version
        id: version
        run: |
          echo "build=$(( 1000 + ${{ github.run_number }} ))" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"; else echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"; fi

      - name: Archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION=${{ steps.version.outputs.name }} CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }}

      - name: Upload to TestFlight
        run: |
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}
