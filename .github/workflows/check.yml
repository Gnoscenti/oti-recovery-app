name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content, type-check, unit tests, build
        run: npm run check
      - name: Install Chrome test browser
        run: npx playwright-core install --with-deps chromium
      - name: Chrome review smoke test
        run: node scripts/test-chrome.mjs
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist

