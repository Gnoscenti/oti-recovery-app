name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content, type-check, unit tests, build
        run: npm run check
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify push server imports and types
        run: deno check supabase/functions/event-reminders/index.ts
      - name: Install Chrome and Safari test browsers
        run: npx playwright-core install --with-deps chromium webkit
      - name: Chrome and Safari mobile/desktop regression test
        run: node scripts/test-chrome.mjs
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist

