name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content, type-check, unit tests, build
        run: npm run check
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
