# Publishes the web app (PWA) and the privacy policy to GitHub Pages on every push to main.
# Enable once: repository Settings → Pages → Source: "GitHub Actions".
# Result: https://<owner>.github.io/<repo>/  and  https://<owner>.github.io/<repo>/privacy.html
name: Web (GitHub Pages)

# Hosting is on Vercel (see vercel.json); run this manually only if you want a GitHub Pages copy too.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
